# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: qazaq-handygy
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/site
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: ADMIN_PIN
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: qazaq-data
      mountPath: /var/data
      sizeGB: 1
